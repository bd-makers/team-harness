name: release

# Tags are the release signal. `test.yml` filters on `branches: [main]`, so a
# tag push runs this workflow only — which means nothing here can assume the
# tagged commit was tested elsewhere. The suite runs below before publishing.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # test.yml과 같은 이유다 — 기본값(depth 1)이면 이력 의존 테스트(템플릿 sha 이력 완전성,
          # wiki dogfood의 출처 추론)가 skip되거나 실패한다. v0.47.0 첫 태그가 이것으로 빨개졌다.
          # 이 파일 머리 주석대로 태그 커밋은 다른 곳에서 검증됐다고 가정하지 않으므로 같은 이력에서 돌린다.
          fetch-depth: 0

      # Matches the tested runtime and `engines.node` — publishing must not run
      # on a version the suite never exercises (this was node 20, which is EOL).
      # Kept as a floating major for the same reason as test.yml: it tracks the
      # latest 24.x, so it picks up 24.20.0 (the node:test deserialization fix)
      # and later security patches without a manual bump.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # A tag on a commit whose manifests were never bumped would publish a
      # release that does not match what the plugin reports as its version.
      - name: Verify tag matches the packaged version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ${package_version}" >&2
            exit 1
          fi

      # A `v*` tag can be pushed from any commit, so the tag being green is not
      # inherited from main — verify it here rather than assume it.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@harness.test"
          git config --global user.name "harness-ci"
          git config --global init.defaultBranch main

      - name: Run tests
        run: npm test

      - name: Extract release notes
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
