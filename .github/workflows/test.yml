name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # e2e sandboxes set their own git identity, but done-guard and other
      # tests run git in the checkout itself — give the runner a global one.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@harness.test"
          git config --global user.name "harness-ci"
          git config --global init.defaultBranch main

      # Zero runtime deps and no lockfile, so there is nothing to install —
      # run the suite directly (unit + e2e).
      - name: Run tests
        run: npm test
