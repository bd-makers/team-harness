<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하네스 운용 시나리오 구성기</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --panel2:#1b232d; --line:#26303b;
    --fg:#e6edf3; --muted:#8b98a5; --dim:#6b7785;
    --accent:#7dd3fc; --accent2:#a78bfa;
    --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    padding:14px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.2px}
  header .sub{color:var(--dim);font-size:12px}
  .presets{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .presets button{
    background:var(--panel2);color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;
  }
  .presets button:hover{color:var(--fg);border-color:var(--accent)}
  .presets button.on{background:#0b2b3a;color:var(--accent);border-color:#2a6a86}

  main{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:0}
  #controls{border-right:1px solid var(--line);overflow-y:auto;padding:16px}
  #preview{overflow-y:auto;padding:18px 20px;background:#0b1016}

  .grp{margin-bottom:20px}
  .grp>h3{
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--dim);margin:0 0 8px;font-weight:600;
  }
  .seg{display:flex;flex-wrap:wrap;gap:5px}
  .seg button{
    flex:1 1 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);
    border-radius:7px;padding:7px 9px;font-size:12.5px;cursor:pointer;text-align:center;
  }
  .seg button:hover{border-color:#3b4756}
  .seg button.on{background:#12263a;border-color:var(--accent);color:var(--accent)}
  .chk{display:flex;align-items:flex-start;gap:8px;padding:5px 0;cursor:pointer;font-size:13px}
  .chk input{margin-top:3px;accent-color:var(--accent)}
  .chk.disabled{opacity:.4;cursor:not-allowed}
  .chk small{display:block;color:var(--dim);font-size:11.5px;line-height:1.4}
  input[type=text]{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:8px 10px;font-family:var(--mono);font-size:13px;
  }
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  .tri{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:8px;margin:6px 0}
  .tri label{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tri .seg button{padding:4px 6px;font-size:11.5px}
  .hint{color:var(--dim);font-size:11.5px;margin-top:6px;line-height:1.45}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:12px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.02em;
    display:flex;align-items:center;gap:8px}
  .card h2 .tag{font-size:10.5px;color:var(--dim);font-weight:400;border:1px solid var(--line);
    border-radius:4px;padding:1px 6px}

  ol.steps{list-style:none;counter-reset:s;margin:0;padding:0}
  ol.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:10px;padding:5px 0}
  ol.steps li::before{
    content:counter(s);font-family:var(--mono);font-size:11px;color:var(--dim);
    background:var(--panel2);border-radius:5px;text-align:center;line-height:19px;height:19px;margin-top:2px;
  }
  code{font-family:var(--mono);font-size:12.5px;background:#0c1620;color:var(--accent);
    border:1px solid #1d3040;border-radius:5px;padding:1px 5px}
  .step-t{font-size:13px}
  .step-s{color:var(--dim);font-size:11.5px;line-height:1.45;margin-top:2px}
  .pill{font-size:10px;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
  .pill.gate{background:#2d2410;color:var(--warn);border:1px solid #4a3a15}
  .pill.opt{background:#18212c;color:var(--dim);border:1px solid var(--line)}

  ul.auto{list-style:none;margin:0;padding:0}
  ul.auto li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:4px 0;font-size:12.5px}
  ul.auto li .ev{font-family:var(--mono);font-size:11px;color:var(--accent2);
    background:#1a1526;border:1px solid #2e2545;border-radius:5px;padding:1px 6px;white-space:nowrap;height:fit-content}
  ul.auto li .d{color:var(--muted)}
  ul.auto li .d b{color:var(--fg);font-weight:500;font-family:var(--mono);font-size:12px}

  table.files{width:100%;border-collapse:collapse;font-size:12.5px}
  table.files td{padding:4px 0;vertical-align:top}
  table.files td:first-child{font-family:var(--mono);color:var(--fg);width:48%;padding-right:10px}
  table.files td:last-child{color:var(--dim);font-size:11.5px}
  .own{font-size:10px;border-radius:4px;padding:0 5px;margin-left:6px}
  .own.h{background:#102a1a;color:var(--ok);border:1px solid #1d4a2e}
  .own.m{background:#2a1a10;color:#fb923c;border:1px solid #4a2e1d}

  .guard li{list-style:none;display:grid;grid-template-columns:16px 1fr;gap:9px;padding:5px 0;font-size:12.5px}
  .guard ul{margin:0;padding:0}
  .guard .i{font-weight:700;line-height:1.4}
  .guard .ok .i{color:var(--ok)} .guard .no .i{color:var(--bad)} .guard .wa .i{color:var(--warn)}
  .guard .why{color:var(--dim);font-size:11.5px;line-height:1.45;margin-top:1px}

  .esc{border-color:#4a3a15;background:#1c1608}
  .esc h2{color:var(--warn)}
  .esc ol{margin:0;padding-left:18px;font-size:12.5px}
  .esc ol li{padding:2px 0}
  .esc ol li b{color:var(--fg)}

  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 20px;max-height:38vh;display:flex;flex-direction:column;gap:8px}
  footer .bar{display:flex;align-items:center;gap:10px}
  footer .bar h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0;font-weight:600}
  footer .bar .n{color:var(--dim);font-size:11px;margin-left:auto}
  footer button.copy{
    background:#12263a;border:1px solid #2a6a86;color:var(--accent);border-radius:7px;
    padding:6px 14px;font-size:12.5px;cursor:pointer;font-weight:500;
  }
  footer button.copy:hover{background:#173347}
  pre#prompt{
    margin:0;overflow:auto;background:#0b1016;border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.6;color:#cbd5e1;white-space:pre-wrap;
  }
  @media (max-width:900px){ main{grid-template-columns:1fr} #controls{border-right:none;border-bottom:1px solid var(--line)} }
</style>
</head>
<body>

<header>
  <h1>하네스 운용 시나리오 구성기</h1>
  <span class="sub">harness-aijient-team · 상황을 고르면 실행 순서·자동 훅·<code style="background:none;border:none;padding:0">done</code> 가드 판정이 함께 바뀝니다</span>
  <div class="presets" id="presets"></div>
</header>

<main>
  <aside id="controls"></aside>
  <section id="preview"></section>
</main>

<footer>
  <div class="bar">
    <h3>세션에 붙여넣을 프롬프트</h3>
    <span class="n" id="pnote"></span>
    <button class="copy" id="copy">복사</button>
  </div>
  <pre id="prompt"></pre>
</footer>

<script>
/* ---------------- state ---------------- */
const DEFAULTS = {
  taskName: 'auth-redesign',
  taskState: 'new',          // new | resume
  scenario: 'feature',       // feature | bug | arch | release | setup | docs
  scale: 'medium',           // small | medium | large
  isolation: 'same',         // same | worktree
  sessions: 'one',           // one | multi
  ambiguity: true,
  boundary: false,
  diagram: false,
  reviewKind: 'review',      // none | review | adversarial
  engine: 'auto',            // auto | codex | claude
  personas: { interview:false, contrarian:false, simplifier:false },
  tests: { unit:false, comp:false, int:false },
  evidence: { tests:'required', review:'optional', verify:'optional' },
};
const state = structuredClone(DEFAULTS);

const SCENARIOS = {
  feature: { label:'신규 기능',      touchesSrc:true  },
  bug:     { label:'버그 수정',      touchesSrc:true  },
  arch:    { label:'아키텍처·리팩터', touchesSrc:true  },
  release: { label:'릴리스',         touchesSrc:false },
  setup:   { label:'하네스 정비',    touchesSrc:false },
  docs:    { label:'문서·규칙만',    touchesSrc:false },
};
const SCALES = { small:'작은 변경', medium:'보통', large:'큰 변경 (5파일+ · 아키텍처·보안·동시성)' };

const PRESETS = {
  '신규 기능 (표준)': { scenario:'feature', scale:'medium', taskState:'new', isolation:'same', sessions:'one',
    ambiguity:true, boundary:false, diagram:false, reviewKind:'review', engine:'codex',
    personas:{interview:true,contrarian:false,simplifier:false}, tests:{unit:true,comp:false,int:false},
    evidence:{tests:'required',review:'required',verify:'optional'} },
  '핫픽스 (최소)': { scenario:'bug', scale:'small', taskState:'new', isolation:'same', sessions:'one',
    ambiguity:false, boundary:false, diagram:false, reviewKind:'none', engine:'auto',
    personas:{interview:false,contrarian:false,simplifier:false}, tests:{unit:true,comp:false,int:false},
    evidence:{tests:'required',review:'optional',verify:'optional'} },
  '아키텍처 결정': { scenario:'arch', scale:'large', taskState:'new', isolation:'worktree', sessions:'multi',
    ambiguity:true, boundary:true, diagram:true, reviewKind:'adversarial', engine:'codex',
    personas:{interview:true,contrarian:true,simplifier:true}, tests:{unit:true,comp:false,int:true},
    evidence:{tests:'required',review:'required',verify:'required'} },
  '릴리스': { scenario:'release', scale:'small', taskState:'new', isolation:'same', sessions:'one',
    ambiguity:false, boundary:false, diagram:false, reviewKind:'review', engine:'auto',
    personas:{interview:false,contrarian:false,simplifier:false}, tests:{unit:false,comp:false,int:false},
    evidence:{tests:'skip',review:'optional',verify:'optional'} },
  '하네스 정비': { scenario:'setup', scale:'small', taskState:'new', isolation:'same', sessions:'one',
    ambiguity:false, boundary:false, diagram:false, reviewKind:'none', engine:'auto',
    personas:{interview:false,contrarian:false,simplifier:false}, tests:{unit:false,comp:false,int:false},
    evidence:{tests:'skip',review:'optional',verify:'optional'} },
};

/* ---------------- derived rules ---------------- */
// AGENTS.md / CLAUDE.md: 작은 버그·문서 수정에는 Ambiguity 게이트·페르소나 호출을 생략해도 된다
const gateSkippable = () => state.scale === 'small' && ['bug','docs','setup','release'].includes(state.scenario);
// CLAUDE.md §5-A 복잡도 게이트
const escalates = () => state.scale === 'large' || state.scenario === 'arch';
// done 가드: verify 증거로 인정되는 '검증 프레이밍 kind' 마커를 남기는 단계들
function verifySources(){
  const v=[];
  if(state.reviewKind==='adversarial') v.push('/harness-adversarial-review → <code>kind=&lt;engine&gt;-adversarial</code>');
  if(state.tests.unit||state.tests.comp||state.tests.int) v.push('테스트 3형제 → <code>--framing testcritic</code>');
  if(state.scenario!=='setup') v.push('/harness-ship 7단계 → <code>--framing shipcheck</code>');
  if(state.personas.contrarian && state.engine!=='auto') v.push('/harness-contrarian (엔진 인수) → <code>-contrarian</code>');
  if(state.personas.simplifier && state.engine!=='auto') v.push('/harness-simplifier (엔진 인수) → <code>-simplifier</code>');
  return v;
}
const hasVerifyMarker = () => verifySources().length > 0;
const hasReviewMarker = () => state.reviewKind !== 'none' || hasVerifyMarker();

/* ---------------- controls ---------------- */
function seg(key, opts, cur, onpick){
  return '<div class="seg">' + opts.map(([v,l]) =>
    `<button data-k="${key}" data-v="${v}" class="${cur===v?'on':''}">${l}</button>`).join('') + '</div>';
}
function renderControls(){
  const c = document.getElementById('controls');
  const p = state.personas, t = state.tests, e = state.evidence;
  const skip = gateSkippable();
  c.innerHTML = `
  <div class="grp">
    <h3>task</h3>
    <input type="text" id="taskName" value="${state.taskName}" spellcheck="false">
    <div class="hint"><code>docs/&lt;member&gt;/&lt;name&gt;/</code> 평탄 구조 — <code>feature/</code>·<code>fix/</code> 같은 중간 카테고리는 쓰지 않습니다.</div>
    <div style="height:8px"></div>
    ${seg('taskState',[['new','신규 생성'],['resume','기존 재활성화']],state.taskState)}
  </div>

  <div class="grp">
    <h3>상황</h3>
    ${seg('scenario',Object.entries(SCENARIOS).map(([k,v])=>[k,v.label]),state.scenario)}
  </div>

  <div class="grp">
    <h3>규모</h3>
    ${seg('scale',[['small','작음'],['medium','보통'],['large','큼']],state.scale)}
    <div class="hint">${SCALES[state.scale]}${escalates()?' — <span style="color:var(--warn)">§5-A 복잡도 게이트 발화: 코드 작성 전 멈추고 escalation 패킷</span>':''}</div>
  </div>

  <div class="grp">
    <h3>게이트</h3>
    <label class="chk">
      <input type="checkbox" data-ck="ambiguity" ${state.ambiguity?'checked':''}>
      <span>Ambiguity 자가진단 + Ontology
        <small>${skip?'작은 '+SCENARIOS[state.scenario].label+'에는 <b>생략해도 된다</b> — 강제가 아니라 허용이라 켜 둬도 됩니다':'spec.md 안에 직접 쓴다. 외부 포인터 껍데기 spec은 doctor가 경고'}</small></span>
    </label>
    <label class="chk">
      <input type="checkbox" data-ck="boundary" ${state.boundary?'checked':''}>
      <span>Boundary contracts 선언
        <small>spec의 <code>## Boundary contracts</code> JSON. 선언이 있으면 plan 체크박스 직전에 훅이 자동 대조</small></span>
    </label>
    <label class="chk ${state.taskState==='resume'?'disabled':''}">
      <input type="checkbox" data-ck="diagram" ${state.diagram?'checked':''} ${state.taskState==='resume'?'disabled':''}>
      <span>다이어그램 옵트인
        <small>${state.taskState==='resume'?'재활성화 때는 묻지 않는다 — 신규 생성 시 1회만':'plan.md의 그 체크박스가 곧 상태다. 못 하면 지우지 말고 사유를 달아 닫는다'}</small></span>
    </label>
  </div>

  <div class="grp">
    <h3>리뷰 (D6 · read-only 외부)</h3>
    ${seg('reviewKind',[['none','없음'],['review','표준'],['adversarial','적대적']],state.reviewKind)}
    <div style="height:6px"></div>
    ${seg('engine',[['auto','엔진 자동'],['codex','codex'],['claude','claude']],state.engine)}
    <div class="hint">결과는 activetask artifact <code>## Reviews</code>에 마커로 남고, 그 마커가 <code>done</code> 가드의 증거가 됩니다.</div>
  </div>

  <div class="grp">
    <h3>페르소나</h3>
    <label class="chk"><input type="checkbox" data-pk="interview" ${p.interview?'checked':''}>
      <span>/harness-interview <small>입력(스펙)이 모호한가 — 선행 채점 + 소크라테스 검증</small></span></label>
    <label class="chk"><input type="checkbox" data-pk="contrarian" ${p.contrarian?'checked':''}>
      <span>/harness-contrarian <small>가정이 옳은가 — 엔진 인수를 주면 외부 검증자가 반론</small></span></label>
    <label class="chk"><input type="checkbox" data-pk="simplifier" ${p.simplifier?'checked':''}>
      <span>/harness-simplifier <small>더 적게 만들 수 있는가 — plan의 제거 가능한 단계</small></span></label>
  </div>

  <div class="grp">
    <h3>테스트 층</h3>
    <label class="chk"><input type="checkbox" data-tk="unit" ${t.unit?'checked':''}>
      <span>/harness-unittest <small>Khorikov 원칙 · GWT</small></span></label>
    <label class="chk"><input type="checkbox" data-tk="comp" ${t.comp?'checked':''}>
      <span>/harness-comptest <small>Testing Trophy · 컴포넌트·화면·UI 플로우</small></span></label>
    <label class="chk"><input type="checkbox" data-tk="int" ${t.int?'checked':''}>
      <span>/harness-inttest <small>프로세스 경계 · managed/unmanaged 구분</small></span></label>
  </div>

  <div class="grp">
    <h3>Done evidence 선언</h3>
    ${['tests','review','verify'].map(k=>`
      <div class="tri"><label>${k}</label>
        ${seg('ev:'+k,[['required','required'],['optional','optional'],['skip','skip']],e[k])}
      </div>`).join('')}
    <div class="hint">spec의 <code>## Done evidence</code> JSON. 가드는 판정 창(<code>reopenedAt || firstActivatedAt</code> 이후) 안의 마커 <b>존재·kind·시각</b>만 읽습니다 — finding 품질은 판정하지 않습니다.</div>
  </div>

  <div class="grp">
    <h3>격리 · 세션</h3>
    ${seg('isolation',[['same','같은 워킹트리 (D4)'],['worktree','별도 worktree (D5)']],state.isolation)}
    <div style="height:6px"></div>
    ${seg('sessions',[['one','한 세션'],['multi','여러 세션']],state.sessions)}
  </div>`;

  c.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, v=b.dataset.v;
    if(k.startsWith('ev:')) state.evidence[k.slice(3)]=v; else state[k]=v;
    if(k==='taskState' && v==='resume') state.diagram=false;
    updateAll();
  });
  c.querySelectorAll('[data-ck]').forEach(i=>i.onchange=()=>{ state[i.dataset.ck]=i.checked; updateAll(); });
  c.querySelectorAll('[data-pk]').forEach(i=>i.onchange=()=>{ state.personas[i.dataset.pk]=i.checked; updateAll(); });
  c.querySelectorAll('[data-tk]').forEach(i=>i.onchange=()=>{ state.tests[i.dataset.tk]=i.checked; updateAll(); });
  const tn=document.getElementById('taskName');
  tn.oninput=()=>{ state.taskName=tn.value.trim()||'my-task'; renderPreview(); updatePrompt(); };
}

/* ---------------- steps ---------------- */
function buildSteps(){
  const n = state.taskName, S = [], eng = state.engine==='auto' ? '' : ' '+state.engine;
  const push=(t,s,pill)=>S.push({t,s,pill});

  push(`<code>/harness-task ${n}</code>`,
    state.taskState==='new'
      ? '생성 → <code>created:</code> · <code>.harness/active.json</code>이 이 task를 가리킨다'
      : '같은 이름이 이미 있으면 그 task를 active로 전환 — 완료 상태는 만료되고 <code>reopened:</code>');

  if(escalates()){
    push('<b>멈추고 escalation 패킷 5항목 제출</b>',
      'CLAUDE.md §5-A — 결정 요청 · 권장안 · 시도한 대안 · 기다림의 비용 · 안전 기본값. 코드를 쓰기 전에.', 'gate');
  }

  if(state.taskState==='new' && state.diagram)
    push('다이어그램 옵트인 질문에 <b>예</b>',
      'plan.md에 그 단계가 추가된다 — 이 체크박스가 곧 상태다. 도구가 없으면 지우지 말고 <code>- [x] … — 미실행(도구 없음)</code>으로 닫고 artifact에 한 줄', 'gate');

  if(state.scenario==='setup'){
    push('<code>/harness-init</code>','기존 파일은 비파괴 — 마커 섹션 교체 · JSON deep-merge · hooks/rules/skills는 있으면 건너뜀');
    push('<code>/harness-migrate</code>','템플릿 수정이 <b>기존 설치</b>에 도달하는 유일한 경로 (init은 기존 파일을 건너뛴다)');

    if(state.personas.contrarian) push('<code>/harness-contrarian'+eng+'</code>','spec·plan의 모든 가정에 의문 — 엔진 인수를 주면 외부 read-only 검증자가 반론');

  push('PR/MR 생성','사용자 지시로 별도 진행 (<code>git push</code>·<code>gh pr create</code>는 settings의 <code>ask</code> 목록)', 'opt');

  push('<code>/harness-task done</code>','가드가 판정 창 안의 증거를 결정론적으로 검사 → meta status <code>done</code>', 'gate');
  push('기본 브랜치에서 <code>harness-team summary --write</code>',
    `<code>task</code>/<code>done</code>은 집계 파일을 건드리지 않는다${state.isolation==='worktree'?' — 브랜치를 병렬로 둬도 충돌하지 않는 이유':''}`);
  push('<code>/harness-promote</code>','같은 교정이 3회 이상 반복되고 주관 없이 검사 가능할 때만. 사용자가 항목을 고른다 — LLM 자기 승격 경로는 없다', 'opt');

function buildGuard(){
  const e=state.evidence, sc=SCENARIOS[state.scenario], anyTest=state.tests.unit||state.tests.comp||state.tests.int;
  const G=[];
  // tests
  if(e.tests==='required'){
    if(!sc.touchesSrc) G.push(['wa','tests: required — 소스 변경이 없는 시나리오',`${sc.label}에서 소스가 안 바뀌면 통과하지만, 바뀌면 테스트 파일 변경도 요구됩니다`]);
    else if(anyTest) G.push(['ok','tests: required — 테스트 층이 선택됨','소스가 바뀌면 테스트 파일 변경도 커밋에 포함하세요']);
    else G.push(['no','tests: required 인데 테스트 층이 하나도 없음','소스가 바뀌면 가드가 막습니다 — 테스트 층을 켜거나 <code>tests</code>를 낮추세요']);
  } else G.push(['ok',`tests: ${e.tests}`,'소스 변경과 테스트 파일 변경을 대조하지 않습니다']);
  // review
  if(e.review==='required'){
    if(hasReviewMarker()) G.push(['ok','review: required — 판정 창 안에 리뷰 마커가 생김','kind는 대조하지 않습니다']);
    else G.push(['no','review: required 인데 리뷰 마커를 남기는 단계가 없음','<code>/harness-review</code>를 켜거나 <code>review</code>를 <code>optional</code>로']);
  } else G.push(['ok',`review: ${e.review}`,'리뷰 마커를 요구하지 않습니다']);
  // verify
  if(e.verify==='required'){
    const vs=verifySources();
    if(vs.length===1 && vs[0].startsWith('/harness-ship'))
      G.push(['wa','verify: required — 증거원이 ship의 shipcheck 하나뿐','외부 엔진이 없거나 ship 7단계를 건너뛰면 마커가 안 남아 <code>done</code>이 막힙니다. 적대적 리뷰·테스트 3형제 중 하나를 더 켜 두는 쪽이 안전합니다']);
    else if(vs.length) G.push(['ok','verify: required — 검증 프레이밍 마커를 남기는 단계가 있음','증거원: '+vs.join(' · ')+'. 모두 외부 read-only 엔진(codex·claude)이 있어야 실행됩니다']);
    else G.push(['no','verify: required 인데 검증 프레이밍이 없음','<b>일반 review 마커는 verify 증거가 되지 않습니다.</b> 적대적 리뷰·테스트 3형제·contrarian/simplifier(엔진 인수) 중 하나를 켜세요']);
  } else G.push(['ok',`verify: ${e.verify}`,'검증 프레이밍 마커를 요구하지 않습니다']);
  // plan checkbox
  if(state.diagram && state.taskState==='new')
    G.push(['wa','plan의 다이어그램 체크박스','열어 두면 <code>done</code>이 막힙니다 — 못 하면 지우지 말고 사유를 붙여 닫으세요']);
  G.push(['wa','plan.md 미완 <code>- [ ]</code>','하나라도 남으면 <code>done</code>이 막힙니다']);
  if(state.isolation==='worktree')
    G.push(['wa','D5 — 격리 브랜치·worktree','쓰기 대상이 겹치지 않아 허용. 단 <b>한 세션 안에서는</b> D4(단일 스레드)가 그대로 적용됩니다']);
  return G;
}

function strip(h){ return h.replace(/<[^>]+>/g,'')
  .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').trim(); }

  const n=state.taskName, e=state.evidence, sc=SCENARIOS[state.scenario], L=[];

  L.push(`- 격리: ${state.isolation==='worktree'?'별도 worktree·브랜치 (D5)':'같은 워킹트리 (D4)'} / ${state.sessions==='multi'?'여러 세션':'한 세션'}`);

  if(escalates()){
    L.push('먼저 CLAUDE.md §5-A 복잡도 게이트에 해당해. 코드를 쓰기 전에 멈추고 escalation 패킷 5항목(결정 요청 / 권장안 / 시도한 대안 / 기다림의 비용 / 안전 기본값)을 나한테 줘. 내가 답하기 전까지는 아무것도 바꾸지 마.');

  L.push('## 실행 순서');

  L.push('## 지켜야 할 계약');

  else L.push(`- 작은 ${sc.label}이라 Ambiguity 자가진단 게이트와 페르소나 호출은 생략한다.`);

  if(state.taskState==='new' && state.diagram) L.push('- 다이어그램 옵트인 단계를 plan.md에 넣는다. 산출물은 자립형 inline SVG. 도구가 없으면 단계를 지우지 말고 `- [x] … — 미실행(도구 없음)`으로 닫고 artifact에 한 줄 남긴다.');
  L.push(`- spec의 \`## Done evidence\`를 \`{ "version": 1, "tests": "${e.tests}", "review": "${e.review}", "verify": "${e.verify}" }\` 로 선언한다.`);
  if(e.verify==='required') L.push('- verify 증거는 검증 프레이밍 kind 마커(-adversarial · -testcritic · -shipcheck · -contrarian · -simplifier)만 인정된다. 일반 review 마커로는 통과하지 못한다.');
  L.push('- plan.md 체크박스는 실제로 끝난 단계만 `- [x]`로 켠다. 미리 켜지 않는다.');
  L.push('- 리뷰 결과는 활성 task의 artifact.md `## Reviews`에 날짜·엔진과 함께 남긴다. 남기지 않은 리뷰는 안 한 것으로 친다.');
  L.push('- 팀 학습은 artifact.md가 SSOT다. 개인 메모리에는 개인 선호·머신 환경만 둔다.');
  if(state.isolation==='worktree') L.push('- 격리된 브랜치·worktree에서 작업하고 PR/MR로 병합한다(D5). 단 한 세션 안에서는 쓰기를 단일 스레드로 유지한다(D4).');
  else L.push('- 같은 워킹트리·브랜치 안에서 쓰기는 단일 스레드다(D4). 병렬 쓰기 에이전트를 두지 않는다.');
  if(state.sessions==='multi') L.push('- 세션을 넘기기 전과 plan의 atomic step이 바뀔 때 TCC(`<name>-context.md`)를 갱신한다. 6 KiB · 비공백 100행 · 미해결 failure capsule 3개 이하.');
  L.push('- `/harness-ship`은 준비 완료 보고에서 멈춘다. PR/MR 생성과 push는 내 지시를 받고 한다.');
  L.push('- `task`/`done`은 집계 파일을 건드리지 않는다. `docs/task_summary.md` 갱신은 기본 브랜치에서 `harness-team summary --write`로만 한다.');
  L.push('');
  L.push('진행 중 막히면 멈추고 다시 계획해. 동작을 증명하지 않고 완료 처리하지 마.');

  const txt=L.join('\n');
  document.getElementById('prompt').textContent=txt;
  document.getElementById('pnote').textContent=`${txt.length.toLocaleString()}자`;
}

/* ---------------- presets ---------------- */
function renderPresets(){
  const el=document.getElementById('presets');
  el.innerHTML=Object.keys(PRESETS).map(k=>`<button data-p="${k}">${k}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    Object.assign(state, structuredClone(PRESETS[b.dataset.p]));
    el.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    updateAll();
  });
}

function updateAll(){ renderControls(); renderPreview(); updatePrompt(); }

document.getElementById('copy').onclick=async()=>{
  const b=document.getElementById('copy');
  try{ await navigator.clipboard.writeText(document.getElementById('prompt').textContent); }
  catch(_){ const r=document.createRange(); r.selectNode(document.getElementById('prompt'));
    getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); }
  const o=b.textContent; b.textContent='복사됨!'; setTimeout(()=>b.textContent=o,1200);
};

renderPresets();
updateAll();
</script>
