<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>review-evidence-cli-owned — 흐름</title>
<style>
  body { margin: 0; padding: 24px; background: #fafafa; color: #1a1a1a; font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: #555; }
  svg { max-width: 100%; height: auto; display: block; }
  .box { fill: #fff; stroke: #333; stroke-width: 1.2; }
  .harness { fill: #eef6ff; stroke: #2a6ebb; }
  .agent { fill: #fff7e6; stroke: #b8741a; }
  .ext { fill: #f3f3f3; stroke: #777; stroke-dasharray: 4 3; }
  .gate { fill: #f0fff0; stroke: #2e7d32; }
  .off { fill: #fff0f0; stroke: #b3261e; }
  text { font: 12px system-ui, sans-serif; fill: #1a1a1a; }
  .t { font-weight: 600; }
  .s { font-size: 11px; fill: #555; }
  .arrow { stroke: #333; stroke-width: 1.2; fill: none; marker-end: url(#a); }
  .arrow.no { stroke: #b3261e; stroke-dasharray: 5 3; marker-end: url(#ar); }
  .lbl { font-size: 11px; fill: #333; }
</style>
</head>
<body>
<h1>review-evidence-cli-owned — 리뷰 증거가 어디서 만들어지고 누가 읽는가</h1>
<p>위: 이전(에이전트가 마커를 손으로 씀). 아래: 이 task 이후(CLI가 실행·기록, 가드는 meta를 읽음). 회색 점선은 harness 밖.</p>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="review evidence flow before and after">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker>
  </defs>

  <!-- BEFORE -->
  <text x="16" y="24" class="t">이전</text>
  <rect x="16" y="40" width="170" height="64" rx="6" class="box agent"/>
  <text x="28" y="62" class="t">에이전트 세션</text>
  <text x="28" y="80" class="s">harness-review.md 1~6단계</text>
  <text x="28" y="94" class="s">전부 산문 절차</text>

  <rect x="260" y="40" width="150" height="64" rx="6" class="box ext"/>
  <text x="272" y="62" class="t">리뷰 엔진</text>
  <text x="272" y="80" class="s">codex exec / claude -p</text>
  <text x="272" y="94" class="s">(손으로 실행)</text>

  <rect x="480" y="40" width="200" height="64" rx="6" class="box"/>
  <text x="492" y="62" class="t">artifact ## Reviews</text>
  <text x="492" y="80" class="s">산문 + 마커 한 줄</text>
  <text x="492" y="94" class="s">&lt;!-- harness:review kind= at= --&gt;</text>

  <rect x="760" y="40" width="180" height="64" rx="6" class="box gate"/>
  <text x="772" y="62" class="t">done 가드</text>
  <text x="772" y="80" class="s">parseReviewMarkers</text>
  <text x="772" y="94" class="s">kind · at 만 읽음</text>

  <path d="M186 60 L258 60" class="arrow"/>
  <text x="196" y="52" class="lbl">실행</text>
  <path d="M410 72 L478 72" class="arrow"/>
  <text x="418" y="64" class="lbl">출력 요약</text>
  <path d="M186 90 C 330 140, 400 140, 478 92" class="arrow no"/>
  <text x="290" y="132" class="lbl" fill="#b3261e">마커를 손으로 append — 실행을 건너뛰어도 같은 줄</text>
  <path d="M680 72 L758 72" class="arrow"/>
  <text x="690" y="64" class="lbl">스캔</text>

  <line x1="16" y1="170" x2="944" y2="170" stroke="#ccc" stroke-dasharray="2 4"/>

  <!-- AFTER -->
  <text x="16" y="200" class="t">이 task 이후</text>
  <rect x="16" y="216" width="170" height="80" rx="6" class="box agent"/>
  <text x="28" y="238" class="t">에이전트 세션</text>
  <text x="28" y="256" class="s">엔진·scope 인자 전달</text>
  <text x="28" y="270" class="s">4단계 판별 산문 작성</text>
  <text x="28" y="284" class="s">마커는 쓰지 않음</text>

  <rect x="250" y="216" width="200" height="80" rx="6" class="box harness"/>
  <text x="262" y="238" class="t">harness-team review</text>
  <text x="262" y="256" class="s">엔진 결정(probe 체인) · scope</text>
  <text x="262" y="270" class="s">runner 표 그대로 실행</text>
  <text x="262" y="284" class="s">--framing → kind 조립(allowlist)</text>

  <rect x="510" y="216" width="150" height="80" rx="6" class="box ext"/>
  <text x="522" y="238" class="t">리뷰 엔진</text>
  <text x="522" y="256" class="s">codex · claude · custom</text>
  <text x="522" y="270" class="s">stdin 닫음</text>
  <text x="522" y="284" class="s">exit code + stdout</text>

  <path d="M186 256 L248 256" class="arrow"/>
  <path d="M450 256 L508 256" class="arrow"/>
  <text x="456" y="248" class="lbl">spawn</text>

  <!-- exit 0 branch -->
  <rect x="250" y="340" width="200" height="72" rx="6" class="box harness"/>
  <text x="262" y="362" class="t">&lt;name&gt;-meta.json</text>
  <text x="262" y="380" class="s">reviews[] append</text>
  <text x="262" y="394" class="s">{kind, engine, scope, tip, at, exitCode, outputBytes}</text>

  <rect x="480" y="340" width="200" height="72" rx="6" class="box"/>
  <text x="492" y="362" class="t">artifact ## Reviews</text>
  <text x="492" y="380" class="s">### at — kind (harness-team review)</text>
  <text x="492" y="394" class="s">출력(상한) + 종전 형식 마커</text>

  <path d="M350 296 L350 338" class="arrow"/>
  <text x="358" y="322" class="lbl">exit 0 — meta 먼저</text>
  <path d="M450 376 L478 376" class="arrow"/>
  <text x="452" y="368" class="lbl">그다음</text>

  <!-- exit != 0 branch -->
  <rect x="16" y="340" width="190" height="72" rx="6" class="box off"/>
  <text x="28" y="362" class="t">exit ≠ 0 · 엔진 미가용</text>
  <text x="28" y="380" class="s">아무것도 쓰지 않음</text>
  <text x="28" y="394" class="s">error 패킷 (stderr tail)</text>
  <path d="M300 296 C 260 330, 200 330, 180 340" class="arrow no"/>

  <!-- guard -->
  <rect x="740" y="330" width="204" height="92" rx="6" class="box gate"/>
  <text x="752" y="352" class="t">done 가드</text>
  <text x="752" y="370" class="s">meta에 reviews 키 있음 →</text>
  <text x="752" y="384" class="s">  verify = meta.reviews만 (마커 불인정)</text>
  <text x="752" y="398" class="s">  review = meta ∪ 마커</text>
  <text x="752" y="412" class="s">키 없음(구 task) → 종전 판정</text>

  <path d="M450 356 C 600 320, 700 320, 738 352" class="arrow"/>
  <text x="600" y="316" class="lbl">verify 정본</text>
  <path d="M680 396 L738 396" class="arrow"/>
  <text x="690" y="412" class="lbl">review만</text>

  <!-- footnote -->
  <text x="16" y="470" class="s">위협 모델은 그대로다(망각·실수). meta를 손으로 고치는 것은 done-guard-window가 --force와 같은 고의로 분류한 범주.</text>
  <text x="16" y="488" class="s">바뀐 것: "리뷰를 안 돌리고 마커만 쓰기"가 절차 안의 지름길 → harness 상태를 손대는 행위. 리뷰 품질은 여전히 4단계 판별(사람·세션)의 몫.</text>
  <text x="16" y="520" class="s">정본: commands/harness-review.md(runner 표·프롬프트) · src/commands/review.mjs(구현) · src/commands/task.mjs collectDoneIssues(가드)</text>
</svg>
</body>
</html>
